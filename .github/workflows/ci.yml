# @steered AudibleSecurityContext 1.2 2026-10-01
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compile and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # astro check + tsc --noEmit + astro build
      - name: Compile
        run: npm run compile

      # Integration tests need live Google credentials and run in their own
      # workflow; this job covers everything that runs without secrets.
      - name: Unit tests
        run: npx vitest run --exclude 'tests/integration/**'

  playwright:
    name: Browser Tests (mocked + real backend vs fixtures)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Netlify adapter starts a local Edge Functions server under
      # `astro dev`, which needs Deno ^2.2.4. With an older Deno it fails at
      # startup and Astro draws an error overlay over any open page, which
      # blocks clicks in whichever test is loading at that moment. Pinned to
      # 2.2: newer releases reject the `deno eval --allow-scripts` flag the
      # Netlify dev server passes.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.2.x

      - name: Install Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npx playwright test

      # Screenshots of every submit case, plus video and trace for failures
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
