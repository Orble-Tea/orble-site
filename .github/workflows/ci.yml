name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compile and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # astro check + tsc --noEmit + astro build
      - name: Compile
        run: npm run compile

      # Integration tests need live Google credentials and run in their own
      # workflow; this job covers everything that runs without secrets.
      - name: Unit tests
        run: npx vitest run --exclude 'tests/integration/**'

  playwright:
    name: Browser Tests (mocked + real backend vs fixtures)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Zero secrets: layer 2 intercepts /api/* in the browser; layer 3 runs
      # the real backend against the local fixture server. The manual live
      # smoke (tests/smoke) is deliberately NOT run here; see README.
      - name: Playwright tests
        run: npx playwright test
